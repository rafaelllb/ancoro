version: '3.8'

# Ancoro Development Infrastructure
# Uso: docker compose up -d postgres
# Reset: docker compose down -v && docker compose up -d postgres

services:
  postgres:
    image: postgres:16-alpine  # [2026-10-15] alpine: já presente na máquina do Rafael (o pull da imagem completa falhou por rede) — mesma versão major
    container_name: ancoro-postgres
    environment:
      POSTGRES_USER: ancoro
      POSTGRES_PASSWORD: ancoro
      POSTGRES_DB: ancoro_dev
    ports:
      - "${ANCORO_PG_PORT:-5432}:5432"  # [2026-10-15] porta configurável: na máquina do Rafael a 5432 é de um Postgres nativo (use ANCORO_PG_PORT=5433 no .env da raiz)
    volumes:
      - ancoro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ancoro -d ancoro_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin para visualização (opcional, descomente se necessário)
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: ancoro-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@ancoro.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres

volumes:
  ancoro_pgdata:
