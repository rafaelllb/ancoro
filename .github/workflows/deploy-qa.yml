# Deploy QA Workflow
# Executa deploy automático para ambiente QA após merge em develop
# Ver: docs/INFRASTRUCTURE_GUIDE.md seção 6.1

name: Deploy QA

on:
  push:
    branches: [develop]

env:
  NODE_VERSION: '18'

jobs:
  migrate-qa:
    name: Migrate QA Database
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Run migrations on QA database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_QA_DATABASE_URL }}
        run: npx prisma migrate deploy --schema prisma/schema.prisma

