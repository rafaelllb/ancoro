# PR Checks Workflow
# Executa lint, typecheck, testes e build em toda PR
# Ver: docs/INFRASTRUCTURE_GUIDE.md seção 6.1

name: PR Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '18'

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present

      - name: TypeCheck backend
        working-directory: backend
        run: npm run typecheck --if-present || npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: TypeCheck frontend
        working-directory: frontend
        run: npm run typecheck --if-present || npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ancoro
          POSTGRES_PASSWORD: ancoro
          POSTGRES_DB: ancoro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # [2026-10-16] Criado: o backend importa backend/vendor/processkit.cjs (gitignored),
      # gerado a partir de process-core + process-publisher. Sem isto, processes.test.ts falha — Rafael Brito
      - name: Install Process Studio packages
        run: npm run install:process-studio

      - name: Build processkit (backend/vendor)
        run: npm run build:processkit

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ancoro:ancoro@localhost:5432/ancoro_test
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ancoro:ancoro@localhost:5432/ancoro_test
          JWT_SECRET: test_secret_for_ci_min_32_characters
          NODE_ENV: test
        run: npm test -- --coverage --passWithNoTests

      # TODO [ESTIGMERGIA]: Upload coverage to Codecov
      # - Habilitar quando tiver testes implementados
      # - Criar conta no Codecov e adicionar CODECOV_TOKEN nos secrets
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Generate Prisma Client (backend)
        working-directory: backend
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # [2026-10-16] Criado: testes unitários dos pacotes standalone do Process Studio
  # (process-core: modelo/BPMN/validação/edição; process-publisher: portal, 16 testes em Chrome
  # real ficam fora do CI por ora). Ver docs/process-studio/README.md §6.4 — Rafael Brito
  process-studio:
    name: Process Studio (packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            packages/process-core/package-lock.json
            packages/process-render/package-lock.json
            packages/process-editor/package-lock.json
            packages/process-publisher/package-lock.json
            apps/standalone/package-lock.json

      - name: Install packages
        run: npm run install:process-studio

      - name: Test process-core
        working-directory: packages/process-core
        run: npm test

      # Testes em Chrome real são pulados sozinhos quando não há Chrome (HAS_CHROME)
      - name: Test process-publisher
        working-directory: packages/process-publisher
        run: npm test

      - name: Typecheck + build editor (modo Ancoro)
        run: npm run build:process-studio

      # [2026-10-16] Criado: adaptador standalone (Fase 6). O E2E em Chrome (npm run e2e) fica fora do CI por ora — Rafael Brito
      - name: Standalone — instalar, compilar, typecheck e testar
        working-directory: apps/standalone
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test
